<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG card</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0d0d0d; }
      .card { width: 1200px; height: 630px; box-sizing: border-box; padding: 72px 80px; background: radial-gradient(1200px 600px at 10% 0%, #142238 0%, #0d0d0d 55%); color: #fff; font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; position: relative; overflow: hidden; }
      .logo { display: flex; align-items: center; gap: 16px; font-size: 34px; font-weight: 800; letter-spacing: -0.5px; }
      .logo span { color: #3987e5; }
      h1 { font-size: 60px; line-height: 1.08; margin: 44px 0 20px; font-weight: 800; letter-spacing: -1.5px; max-width: 820px; }
      p { font-size: 26px; color: #c3c2b7; margin: 0; max-width: 780px; line-height: 1.35; }
      .pills { position: absolute; left: 80px; bottom: 64px; display: flex; gap: 12px; }
      .pill { border: 1px solid #383835; background: #1a1a19; border-radius: 999px; padding: 10px 18px; font-size: 20px; color: #c3c2b7; font-family: ui-monospace, Consolas, monospace; }
      .score { position: absolute; right: 80px; top: 120px; width: 300px; height: 300px; border-radius: 32px; background: #1a1a19; border: 1px solid #2c2c2a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
      .score .n { font-size: 150px; font-weight: 800; line-height: 1; color: #3ecf3e; font-family: ui-monospace, Consolas, monospace; }
      .score .l { font-size: 24px; color: #3ecf3e; font-weight: 700; }
      .score .s { font-size: 16px; color: #898781; }
      .bar { position: absolute; right: 80px; top: 440px; width: 300px; height: 16px; border-radius: 999px; overflow: hidden; display: flex; gap: 2px; background: #222221; }
      .bar div { height: 100%; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo"><svg width="44" height="44" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#1a1a19" /><path d="M6 22 L13 14 L18 18 L26 8" stroke="#3987e5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg>Conviction <span>&nbsp;2.0</span></div>
      <h1>Six models.<br />One score.<br />Every number shown.</h1>
      <p>DCF, Monte Carlo, risk, momentum, financial health and insider models on any US stock or portfolio, with point-in-time backtesting.</p>
      <div class="pills"><div class="pill">tradeconviction.com</div><div class="pill">no black boxes</div></div>
      <div class="score"><div class="n">72</div><div class="l">High conviction</div><div class="s">weighted average of six subscores</div></div>
      <div class="bar"><div style="width:22%;background:#3987e5"></div><div style="width:18%;background:#d95926"></div><div style="width:16%;background:#199e70"></div><div style="width:17%;background:#c98500"></div><div style="width:15%;background:#d55181"></div><div style="width:12%;background:#9085e9"></div></div>
    </div>
  </body>
</html>
